<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 931.85 736.8" role="img" aria-labelledby="title desc">
  <title id="title">Beyond Fear — reworked vector flame</title>
  <desc id="desc">Crisp white lettering crossed by a layered, realistic gold-orange vector flame with a colour-preserving glow.</desc>

  <defs>
    <linearGradient id="fire-shell" x1="438" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d92c00"/>
      <stop offset="0.16" stop-color="#ff5a00"/>
      <stop offset="0.37" stop-color="#ffad00"/>
      <stop offset="0.53" stop-color="#ffe96a"/>
      <stop offset="0.66" stop-color="#fff6bc"/>
      <stop offset="0.82" stop-color="#ff9a00"/>
      <stop offset="1" stop-color="#e13b00"/>
    </linearGradient>

    <linearGradient id="fire-core" x1="0" y1="72" x2="0" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff1a0"/>
      <stop offset="0.2" stop-color="#fffdf0"/>
      <stop offset="0.48" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#fff2a0"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>

    <linearGradient id="fire-edge" x1="0" y1="70" x2="0" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffca21" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#ff7a00" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffb000" stop-opacity="0.75"/>
      <stop offset="0.78" stop-color="#ff5b00" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffbd21" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="simple-fire" x1="558" y1="0" x2="593" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ef6500"/>
      <stop offset="0.2" stop-color="#ff9c17"/>
      <stop offset="0.46" stop-color="#ffd56a"/>
      <stop offset="0.64" stop-color="#fff1bd"/>
      <stop offset="0.82" stop-color="#ffbd3b"/>
      <stop offset="1" stop-color="#ed6900"/>
    </linearGradient>

    <filter id="fire-glow" x="400" y="25" width="145" height="690" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="outer-alpha"/>
      <feFlood flood-color="#ff6500" flood-opacity="0.16" result="outer-colour"/>
      <feComposite in="outer-colour" in2="outer-alpha" operator="in" result="outer-glow"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="middle-alpha"/>
      <feFlood flood-color="#ffad19" flood-opacity="0.32" result="middle-colour"/>
      <feComposite in="middle-colour" in2="middle-alpha" operator="in" result="middle-glow"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="inner-alpha"/>
      <feFlood flood-color="#fff0a0" flood-opacity="0.58" result="inner-colour"/>
      <feComposite in="inner-colour" in2="inner-alpha" operator="in" result="inner-glow"/>

      <feMerge>
        <feMergeNode in="outer-glow"/>
        <feMergeNode in="middle-glow"/>
        <feMergeNode in="inner-glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hot-core-glow" x="420" y="40" width="110" height="670" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="soft"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.75" result="tight"/>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="tight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="letter-glow" x="-2%" y="-30%" width="104%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.7" result="letter-alpha"/>
      <feFlood flood-color="#e8bc68" flood-opacity="0.22" result="letter-colour"/>
      <feComposite in="letter-colour" in2="letter-alpha" operator="in" result="letter-halo"/>
      <feMerge>
        <feMergeNode in="letter-halo"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Existing lettering preserved as clean outlined vectors. -->
  <g id="lettering" fill="#f8f7f0" stroke="#d9b77a" stroke-width="0.8" paint-order="stroke fill" filter="url(#letter-glow)" transform="translate(-101.29 -201.84)">
