    <path d="M902.94,593.88l16.16-45.43,5.32,0,16.64,45.26-6.73,0L921.81,557.2l-12.14,36.65Zm7.51-10,0-6,23.4-.12,0,6Z"/>
    <path d="M814.51,593.86l-.24-45.35,6.24,0,.24,45.35Zm2.82-39.31,0-6,25.55-.14,0,6Zm.1,19.8,0-6.05,22.18-.12,0,6.06Zm.1,19.49,0-6.05,25.54-.13,0,6.05Z"/>
