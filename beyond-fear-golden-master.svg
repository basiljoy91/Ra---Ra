    <path d="M477.14,592.25l-.24-45.31,5.66,0,21.94,34.94-.73.81-.19-35.87,6.18,0,.23,45.32-5.72,0L482.41,557.7l.73-.82.18,35.34Z"/>
    <path d="M579.17,593.78l-.24-45.35,6.89,0,.24,45.35Zm4.66,0,0-6,11.12-.06c3.62,0,6.43-.9,8.41-2.65a9.18,9.18,0,0,0,2.95-7.36l-.07-13.35a9.18,9.18,0,0,0-3-7.33c-2-1.72-4.81-2.58-8.44-2.56l-11.11.06,0-6.05,10.91-.06q8.91,0,13.82,4.19t4.94,12l.07,12.84a16.67,16.67,0,0,1-2.15,8.8,14.05,14.05,0,0,1-6.35,5.58,24.29,24.29,0,0,1-10.13,2Z"/>
    <path d="M1000.72,592.29l-.24-45.39,6.24,0,.24,45.38Zm2.62-19.2,0-6.05,15.17-.08a5.45,5.45,0,0,0,4.36-2,8.73,8.73,0,0,0-.05-10.23,5.48,5.48,0,0,0-4.38-1.91l-15.18.08,0-6.05,14.93-.08a13.68,13.68,0,0,1,6.8,1.6,11.46,11.46,0,0,1,4.53,4.55,15.44,15.44,0,0,1,.06,13.77,11.58,11.58,0,0,1-4.49,4.61,13.47,13.47,0,0,1-6.76,1.67Zm22.4,19.06-10.29-20.53,6.2-1.47,11.49,22Z"/>
    <path d="M902.94,593.88l16.16-45.43,5.32,0,16.64,45.26-6.73,0L921.81,557.2l-12.14,36.65Zm7.51-10,0-6,23.4-.12,0,6Z"/>
    <path d="M814.51,593.86l-.24-45.35,6.24,0,.24,45.35Zm2.82-39.31,0-6,25.55-.14,0,6Zm.1,19.8,0-6.05,22.18-.12,0,6.06Zm.1,19.49,0-6.05,25.54-.13,0,6.05Z"/>
    <path d="M726.68,592.29l-.24-45.35,6.24,0,.24,45.35ZM729.53,553l0-6.05,24.92-.13,0,6.05Zm.1,20.21,0-6,21.57-.11,0,6.05Z"/>
  </g>

  <!-- One continuous ribbon; the D junction is part of the same closed curve. -->
  <g id="fire" filter="url(#fire-glow)">
    <path fill="url(#simple-fire)" stroke="#D7A451" stroke-opacity="0.56" stroke-width="0.4" stroke-linejoin="round" d="M484 72C482 113 490 145 486 183c-4 37-16 69-16 109-1 31 3 58 6 82 4 23 11 42 11 64 1 23-5 46-9 68-6 30-8 57-7 86 1 32-1 58-4 86-4-30-8-57-7-88 0-32 2-60 7-89 4-23 8-43 7-63-1-21-8-40-11-61-4-25-10-51-8-86 2-41 18-72 23-109 5-39-1-71 6-110Z"/>

    <path fill="none" stroke="#FFF8E8" stroke-opacity="0.96" stroke-width="1.35" stroke-linecap="round" d="M484 99c1 31 3 55-2 86-5 35-17 67-18 106-1 32 5 58 8 83 3 23 10 43 10 64 0 23-6 45-10 67-5 30-7 57-6 87 1 27 2 49 1 69"/>
  </g>
</svg>
